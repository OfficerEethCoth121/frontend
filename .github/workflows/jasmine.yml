name: Run Jasmine

on:
  workflow_call:

jobs:
  run-jasmine:
    name: Run Jasmine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Setup Node
        uses: alphagov/govuk-infrastructure/.github/actions/setup-node@main

      - name: Install locked shared publishing-component assets
        run: |
          npm install --prefix "${RUNNER_TEMP}/govuk-components-yarn" --no-audit --no-fund --ignore-scripts yarn@1.22.22
          cd "$(bundle show govuk_publishing_components)"
          YARN_IGNORE_PATH=1 node "${RUNNER_TEMP}/govuk-components-yarn/node_modules/yarn/bin/yarn.js" install --frozen-lockfile --ignore-scripts
          test -f node_modules/govuk-frontend/dist/govuk/_base.scss

      - name: Run Jasmine
        run: yarn run jasmine:ci
