name: Native Frontend image acceptance

# Builds the original GOV.UK Frontend Dockerfile off the production VPS.
# This is an Integration build check, not a release or a production deployment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-frontend-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-frontend:
    name: Build original Frontend image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout this source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Docker Engine with containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: version=29.7.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the unmodified native Dockerfile and load test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: native-frontend-acceptance:${{ github.sha }}
          cache-from: type=gha,scope=frontend-native-amd64
          cache-to: type=gha,mode=max,scope=frontend-native-amd64
          provenance: false

      - name: Inspect the original compiled Rails assets
        env:
          IMAGE: native-frontend-acceptance:${{ github.sha }}
        run: |
          set -eu
          docker image inspect "$IMAGE" --format 'Built image: {{.Id}} platform={{.Os}}/{{.Architecture}} workdir={{.Config.WorkingDir}}'
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test -d public/assets
            find public/assets -type f -name "*.css" | grep -q .
            find public/assets -type f -name "*.js" | grep -q .
            grep -R -l --include="*.css" "gem-c-search__input" public/assets >/dev/null
            grep -R -l --include="*.css" "gem-c-search__submit" public/assets >/dev/null
            echo "Native GOV.UK Rails assets and shared search-component selectors compiled"
          '
